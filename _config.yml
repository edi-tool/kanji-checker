url: "https://edi-tool.github.io"
baseurl: "/kanji-checker"

plugins:
  - jekyll-sitemap

# Google Analytics 4 トラッキングID（例: G-XXXXXXXXXX）
google_analytics: edi-tool

# Search Console の所有権確認ファイルを jekyll-sitemap の出力から除外する
defaults:
  - scope:
      path: "googled180bd734463e748.html"
    values:
      sitemap: false

# 開発用ファイルを公開ビルドから外す（Pages で CLAUDE.md などが配信されないように）
exclude:
  - CLAUDE.md
  - AGENTS.md
  - DESIGN.md
  - progress.md
  - README.md
  - CHANGELOG.md
  - package.json
  - scripts/
  - tests/
  - docs/
